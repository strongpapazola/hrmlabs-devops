# Host-installed Nginx template; replace the reserved hostname and certificate paths.
# Include this file from the host's http context after provisioning a certificate.
server {
    listen 80;
    server_name hrmlabs.example.com;
    return 301 https://hrmlabs.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name hrmlabs.example.com;

    ssl_certificate /etc/letsencrypt/live/hrmlabs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrmlabs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Enable HSTS only after verifying that HTTPS is working for this host.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
