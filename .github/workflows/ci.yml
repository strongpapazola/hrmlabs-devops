name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Install dependencies
        working-directory: application
        run: npm ci --ignore-scripts
      - name: Run tests
        working-directory: application
        run: npm test
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start containers
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Check application and reverse proxy
        run: |
          curl --fail --silent --show-error http://localhost:3000/healthz
          curl --fail --silent --show-error http://localhost:8080/healthz
      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down
      - name: Report result
        if: always()
        env:
          BUILD_RESULT: ${{ job.status }}
        run: |
          echo "### Test and Docker build: ${BUILD_RESULT}" >> "$GITHUB_STEP_SUMMARY"
